services:
  # PostgreSQL 数据库（内置 pgvector 扩展，支持向量搜索）
  db:
    image: pgvector/pgvector:pg16
    container_name: fashion-crm-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-image_search}
      TZ: Asia/Shanghai
    ports:
      # 宿主机映射到 5433，避免与本机已安装的 PostgreSQL(5432) 冲突
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动时自动执行初始化 SQL（建扩展/建表/建索引）
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-image_search}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  # Flask 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fashion-crm-backend:latest
    container_name: fashion-crm-backend
    # 应用凭证由被 Git/Docker build context 忽略的 backend/.env 注入；
    # 下方容器数据库地址显式覆盖其中面向宿主机的 localhost:5433。
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-image_search}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - FLASK_ENV=production
      - TZ=Asia/Shanghai
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    restart: unless-stopped

  # React 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fashion-crm-frontend:latest
    container_name: fashion-crm-frontend
    ports:
      - "0.0.0.0:80:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

# 持久化存储卷
volumes:
  postgres_data:
    driver: local

# 网络配置
networks:
  app-network:
    driver: bridge

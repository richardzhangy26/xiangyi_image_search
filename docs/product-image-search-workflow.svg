<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">商品图像搜索系统工作流程</title>
  <desc id="desc">Kodo 只读备份经过受控迁移写入私有 OSS 和 image_assets，查询图片通过向量检索并从私有预览入口返回短时签名 302。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <style>
      .title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; fill: #17202a; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #253746; }
      .step-title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: bold; fill: #17202a; }
      .step-text { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 14px; fill: #263238; }
      .box { fill: #f0f8ff; stroke: #4682b4; stroke-width: 2; rx: 8; ry: 8; }
      .box-highlight { fill: #e7f8f4; stroke: #0d7a72; stroke-width: 2; rx: 8; ry: 8; }
      .source-box { fill: #fff6e8; stroke: #d97b29; stroke-width: 2; rx: 8; ry: 8; }
      .db-box { fill: #fffaf0; stroke: #b7791f; stroke-width: 2; rx: 8; ry: 8; }
      .section { fill: #f7f8fa; stroke: #a9b3bd; stroke-width: 1; rx: 10; ry: 10; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dotted-line { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5,5; fill: none; }
      .small { font-size: 13px; }
    </style>
  </defs>

  <text x="480" y="38" class="title">商品图像搜索系统工作流程</text>

  <rect x="30" y="65" width="900" height="330" class="section"/>
  <text x="480" y="92" class="subtitle">1. Kodo 只读备份 → 私有 OSS → image_assets</text>

  <rect x="55" y="125" width="195" height="125" class="source-box"/>
  <text x="70" y="150" class="step-title">Kodo 只读备份</text>
  <text x="70" y="178" class="step-text">• 原始对象与来源路径</text>
  <text x="70" y="200" class="step-text">• 仅执行 list / HEAD / GET</text>
  <text x="70" y="222" class="step-text">• 不公开、不删除、不覆盖</text>

  <rect x="290" y="125" width="215" height="125" class="box-highlight"/>
  <text x="305" y="150" class="step-title">受控迁移</text>
  <text x="305" y="178" class="step-text">scripts.migrate_kodo_to_oss</text>
  <text x="305" y="200" class="step-text">preflight / dry-run / pilot</text>
  <text x="305" y="222" class="step-text">显式授权后才允许写入</text>

  <rect x="545" y="110" width="350" height="155" class="box-highlight"/>
  <text x="560" y="138" class="step-title">私有 OSS（正式图片源）</text>
  <text x="560" y="166" class="step-text">• 原图：不可覆盖对象</text>
  <text x="560" y="188" class="step-text">• preview-v1：规范化预览</text>
  <text x="560" y="210" class="step-text">• 隔离前缀 image-search/</text>
  <text x="560" y="232" class="step-text">• 仅由短时签名 URL 访问</text>

  <rect x="290" y="285" width="215" height="80" class="db-box"/>
  <text x="397" y="312" class="step-title" text-anchor="middle">image_assets</text>
  <text x="397" y="336" class="step-text" text-anchor="middle">来源元数据 + 1024 维向量</text>

  <path d="M250 187 L290 187" class="arrow"/>
  <path d="M505 187 L545 187" class="arrow"/>
  <path d="M720 265 L505 325" class="arrow"/>
  <path d="M397 250 L397 285" class="dotted-line"/>

  <rect x="30" y="425" width="900" height="300" class="section"/>
  <text x="480" y="452" class="subtitle">2. 查询图片 → 向量检索 → 私有预览</text>

  <rect x="55" y="510" width="195" height="105" class="box"/>
  <text x="70" y="538" class="step-title">用户上传查询图</text>
  <text x="70" y="566" class="step-text">• 搜索页面选择图片</text>
  <text x="70" y="588" class="step-text">• 点击搜索并设置 Top-K</text>

  <rect x="290" y="510" width="215" height="105" class="box-highlight"/>
  <text x="305" y="538" class="step-title">特征提取</text>
  <text x="305" y="566" class="step-text">DashScope embedding</text>
  <text x="305" y="588" class="step-text">规范化后生成 1024 维向量</text>

  <rect x="545" y="500" width="205" height="125" class="db-box"/>
  <text x="560" y="528" class="step-title">image_assets 检索</text>
  <text x="560" y="556" class="step-text">pgvector cosine / HNSW</text>
  <text x="560" y="578" class="step-text">仅取 status = active</text>
  <text x="560" y="600" class="step-text">按相似度返回资产 ID</text>

  <rect x="790" y="500" width="120" height="125" class="source-box"/>
  <text x="802" y="528" class="step-title">结果预览</text>
  <text x="802" y="554" class="step-text small">/api/image-assets/</text>
  <text x="802" y="574" class="step-text small">{asset_id}/preview</text>
  <text x="802" y="600" class="step-text small">私有 302</text>

  <path d="M250 562 L290 562" class="arrow"/>
  <path d="M505 562 L545 562" class="arrow"/>
  <path d="M750 562 L790 562" class="arrow"/>
  <path d="M650 365 L650 500" class="dotted-line"/>
</svg>

services:
  # PostgreSQL 数据库（内置 pgvector 扩展，支持向量搜索）
  db:
    image: pgvector/pgvector:pg16
    container_name: fashion-crm-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-image_search}
      TZ: Asia/Shanghai
    ports:
      # 宿主机映射到 5433，避免与本机已安装的 PostgreSQL(5432) 冲突
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动时自动执行初始化 SQL（建扩展/建表/建索引）
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-image_search}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  # Flask 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: backend-runtime
    image: fashion-crm-backend:latest
    container_name: fashion-crm-backend
    # 应用凭证由被 Git/Docker build context 忽略的 backend/.env 注入；
    # 下方容器数据库地址显式覆盖其中面向宿主机的 localhost:5433。
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-image_search}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - FLASK_ENV=production
      - PURGE_GATE_EVIDENCE_DIR=/app/purge-gate-evidence
      - PURGE_PIPELINE_EVIDENCE_DIR=/app/purge-evidence
      - TZ=Asia/Shanghai
    ports:
      - "0.0.0.0:5000:5000"
    volumes:
      - ./backend/data:/app/data
      # 五项安全门由部署侧证据发布者维护；应用只读。
      - purge_gate_evidence:/app/purge-gate-evidence:ro
      # 专用清除 worker 写能力证明；Flask 只读并按 TTL 失效关闭。
      - purge_pipeline_evidence:/app/purge-evidence:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL 持久队列 worker；与 HTTP 进程独立，可安全水平扩展。
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: backend-runtime
    image: fashion-crm-backend:latest
    container_name: fashion-crm-image-import-worker
    command: ["python", "-m", "scripts.run_image_import_worker"]
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-image_search}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - app-network
    restart: unless-stopped

  # 永久清除批次 worker：唯一可加载 ops 备份凭证的应用容器。
  # 它读取五项安全门证据，但只写自己的短期能力证明。
  purge-batch-worker:
    build:
      context: ./backend
      target: purge-batch-worker-runtime
    image: fashion-crm-purge-batch-worker:latest
    container_name: fashion-crm-purge-batch-worker
    command: ["python", "-m", "scripts.run_purge_batch_worker"]
    env_file:
      - ./backend/.env.backup
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-image_search}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - PURGE_GATE_EVIDENCE_DIR=/app/purge-gate-evidence
      - PURGE_PIPELINE_EVIDENCE_DIR=/app/purge-evidence
      - BACKUP_ROOT=/var/lib/purge-batch-worker/postgres
      - PURGE_OBJECT_BACKUP_LOCAL_ROOT=/var/lib/purge-batch-worker/object-manifests
      - TZ=Asia/Shanghai
    volumes:
      - purge_gate_evidence:/app/purge-gate-evidence:ro
      - purge_pipeline_evidence:/app/purge-evidence
      - purge_batch_worker_state:/var/lib/purge-batch-worker
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - app-network
    restart: unless-stopped

  # 导入暂存对象清理任务（Issue #22）。
  # 默认不启动：位于 cleanup profile 之后，且进程自身还要求
  # IMPORT_CLEANUP_ENABLED=true。真实 OSS 清理启用需单独明确授权。
  cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: backend-runtime
    image: fashion-crm-backend:latest
    container_name: fashion-crm-import-cleanup
    command: ["python", "-m", "scripts.run_import_cleanup"]
    profiles: ["cleanup"]
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-image_search}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - IMPORT_CLEANUP_ENABLED=${IMPORT_CLEANUP_ENABLED:-false}
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - app-network
    restart: unless-stopped

  # React 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fashion-crm-frontend:latest
    container_name: fashion-crm-frontend
    ports:
      - "0.0.0.0:80:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

# 持久化存储卷
volumes:
  postgres_data:
    driver: local
  # 外部 ops 证据发布者是唯一写者；所有应用服务只读。
  purge_gate_evidence:
    driver: local
  # purge-batch-worker 写能力 heartbeat，Flask 只读。
  purge_pipeline_evidence:
    driver: local
  purge_batch_worker_state:
    driver: local

# 网络配置
networks:
  app-network:
    driver: bridge
